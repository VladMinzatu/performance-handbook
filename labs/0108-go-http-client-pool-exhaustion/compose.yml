# System under test for lab 0108: an open-loop load generator calling
# edge, which calls inventory through a connection pool capped at
# MAX_CONNS. All three join the external `labnet` network created by
# labs/tools/analysis/compose.yml so the analysis container can reach
# them by name (edge's pprof endpoint, inventory's admin endpoint).
services:
  inventory:
    build: .
    image: lab-pool:latest
    container_name: lab-pool-inventory
    command: ["inventory"]
    environment:
      SERVICE_MS: "50"
      WORKERS: "200"
    networks:
      - labnet

  edge:
    image: lab-pool:latest
    container_name: lab-pool-edge
    command: ["edge"]
    environment:
      MAX_CONNS: "20"
      INVENTORY_URL: "http://inventory:8080/item"
    depends_on:
      - inventory
    networks:
      - labnet

  # Idle until a run is started with `docker exec lab-pool-loadgen loadgen ...`.
  loadgen:
    image: lab-pool:latest
    container_name: lab-pool-loadgen
    command: ["sleep", "infinity"]
    depends_on:
      - edge
    networks:
      - labnet

networks:
  labnet:
    external: true
