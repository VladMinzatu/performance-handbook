# System under test for lab 0302. No network reachability needed - `ig`
# and `bpftrace` observe via the analysis container's shared PID
# namespace/cgroups, so neither service joins `labnet`.
#
# pids_limit becomes the cgroup's pids.max. It is deliberately low, and
# leaves headroom above the expected number of children: the Go runtime's
# own threads (a handful) count against the limit as well.
services:
  storm:
    build: .
    container_name: lab-pids-storm
    pids_limit: 20
    command: ["storm"]
    environment:
      INTERVAL_MS: "100"
      CHILD_SECS: "10"

  threads:
    build: .
    container_name: lab-pids-threads
    pids_limit: 20
    command: ["threads"]
    environment:
      INTERVAL_MS: "100"
      GOROUTINES: "200"
