# System under test for lab 004. Joins the external `labnet` network created
# by labs/tools/analysis/compose.yml so the analysis container can reach it.
services:
  postgres:
    image: postgres:16
    container_name: lab-postgres
    # pg_stat_statements needs to be loaded at server start (not just
    # `CREATE EXTENSION`'d) to actually track anything - see the detection
    # step in the README.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - labnet

networks:
  labnet:
    external: true

volumes:
  pgdata:
