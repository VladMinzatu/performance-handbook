# System under test for lab 0401. No labnet needed - `ig` traces via the
# analysis container's shared PID namespace/cgroups, not the network, and
# this lab needs precise control over its own DNS server's address and
# the client's resolv.conf, which is simplest to own in a small dedicated
# network rather than grafting onto the shared one.
services:
  dns-server:
    build: .
    container_name: dns-server
    environment:
      TARGET_FQDN: backend.example.com
    networks:
      dnstest:
        ipv4_address: 172.28.0.10

  dns-client:
    image: debian:bookworm-slim
    container_name: dns-client
    command: ["sleep", "infinity"]
    # Points resolution at dns-server directly (a fixed IP, since the
    # whole point is that name resolution can't yet find it) with a
    # multi-entry search list - the setup Prediction 1/2 depend on.
    dns:
      - 172.28.0.10
    dns_search:
      - ns1.svc.cluster.local
      - svc.cluster.local
      - cluster.local
      - example.com
    networks:
      dnstest:
        ipv4_address: 172.28.0.20

networks:
  dnstest:
    ipam:
      config:
        - subnet: 172.28.0.0/16
