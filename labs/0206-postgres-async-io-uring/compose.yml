# System under test for lab 0206. Joins the external `labnet` network
# created by labs/tools/analysis/compose.yml so the analysis container can
# see and trace this container's process(es).
#
# One Postgres 18 service - `io_method` is a `postmaster`-context setting
# (see README), so switching it means recreating this container with a
# different `command`, not editing multiple services.
services:
  postgres:
    image: postgres:18
    container_name: lab-postgres
    # io_method=io_uring needs real io_uring syscalls (io_uring_setup,
    # io_uring_enter, io_uring_register); Docker's default seccomp
    # profile blocks them, so Postgres fails to start with "could not
    # setup io_uring queue: Operation not permitted" without this. Has no
    # effect on io_method=sync/worker.
    security_opt:
      - seccomp:unconfined
    command:
      - "postgres"
      - "-c"
      - "io_method=worker" # default; override per-experiment (see README)
      - "-c"
      - "shared_buffers=64MB" # kept small so seed.sql's table clearly exceeds it
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      # 18+'s image lays data out under version-specific subdirectories
      # of /var/lib/postgresql itself (pg_ctlcluster-style), not under a
      # .../data mount as in older images.
      - pgdata:/var/lib/postgresql
    networks:
      - labnet

networks:
  labnet:
    external: true

volumes:
  pgdata:
